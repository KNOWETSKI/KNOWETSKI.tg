name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Xcode
        run: |
          XC=$(jq -r .xcode versions.json)
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_$XC.app/Contents/Developer
      - name: Keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          jq --arg id $TG_API_ID --arg hash $TG_API_HASH '.api_id=$id | .api_hash=$hash' build-system/appstore-configuration.json > build-system/my-configuration.json
      - name: Build
        run: |
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py --bazelUserRoot=/private/var/tmp/_bazel_containerhost build --configurationPath=build-system/my-configuration.json --codesigningInformationPath=build-system/fake-codesigning --configuration=release_arm64 --buildNumber=100001
          mkdir -p $GITHUB_WORKSPACE/out
          cp bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: out/Telegram.ipa
