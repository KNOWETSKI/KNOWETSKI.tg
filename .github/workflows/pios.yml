name: Build sideload IPA (Intel)
on:
  workflow_dispatch:
concurrency:
  group: pios-intel
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      BUILD_CONFIGURATION: release_arm64
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_telegram_ios
      BAZEL_CACHE_DIR: ${{ github.workspace }}/.telegram-bazel-cache
      BAZEL_REPO_CACHE: /private/var/tmp/telegram-bazel-repo-cache
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Fix submodule URLs for forks
        run: |
          git config --file=.gitmodules submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config --file=.gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive

      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8

      - name: Fetch libxray framework for VLESS support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p third-party/libxray
          if [ ! -d third-party/libxray/LibXray.xcframework ]; then
            curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o /tmp/libxray-apple-cgo.zip "https://github.com/XTLS/libxray/releases/download/v26.9.9/libxray-apple-cgo.zip" || \
              curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" \
                -o /tmp/libxray-apple-cgo.zip "https://api.github.com/repos/XTLS/libxray/releases/assets/552003020"
            echo "84a11f0923efb65be7631b3c4cac75bd4351fc13b9cc2394def6af5c1696e9fa  /tmp/libxray-apple-cgo.zip" | shasum -a 256 -c -
            unzip -q -o /tmp/libxray-apple-cgo.zip -d /tmp/libxray-extract
            XCFW=$(find /tmp/libxray-extract -name "LibXray.xcframework" -type d | head -1)
            if [ -z "$XCFW" ]; then
              echo "LibXray.xcframework not found in the archive"; exit 1
            fi
            mkdir -p third-party/libxray/LibXray.xcframework
            cp "$XCFW/Info.plist" third-party/libxray/LibXray.xcframework/
            for slice in ios-arm64 ios-arm64-simulator ios-arm64_x86_64-simulator; do
              if [ -d "$XCFW/$slice" ]; then
                cp -R "$XCFW/$slice" third-party/libxray/LibXray.xcframework/
              fi
            done
            ls third-party/libxray/LibXray.xcframework
          fi

      - name: Apply vendored tgcalls patch
        run: |
          cd submodules/TgVoipWebrtc/tgcalls
          git apply --check ../patches/vless-media-socks.patch
          git apply ../patches/vless-media-socks.patch
          python3 ../../../Tests/Upstream13/call_patch.py .

      - name: Select Xcode
        run: |
          XC=$(jq -r .xcode versions.json)
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_$XC.app/Contents/Developer

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Developer/CoreSimulator/Caches /Users/runner/.cargo /Users/runner/.rustup || true
          df -h /

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BAZEL_CACHE_DIR }}
            ${{ env.BAZEL_REPO_CACHE }}
          key: bazel-intel-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-intel-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-
            bazel-intel-

      - name: Write sideload configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 <<'PY'
          import json, os
          path = "build-system/ci-configuration.json"
          with open("build-system/sideload-configuration.json") as f:
              cfg = json.load(f)
          cfg["bundle_id"] = "ph.teleg.Telegrapf"
          cfg["team_id"] = "C67CF9S4VU"
          cfg["enable_siri"] = False
          cfg["enable_icloud"] = False
          api_id = os.environ.get("TELEGRAM_API_ID") or ""
          api_hash = os.environ.get("TELEGRAM_API_HASH") or ""
          if api_id and api_hash:
              cfg["api_id"] = api_id
              cfg["api_hash"] = api_hash
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
              f.write("\n")
          print("bundle_id=" + cfg["bundle_id"], "team_id=" + cfg["team_id"])
          PY

      - name: Build IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p $BAZEL_CACHE_DIR $BAZEL_REPO_CACHE artifacts build/artifacts
          BV=$(jq -r .bazel versions.json | cut -d: -f1)
          curl -fL -o $RUNNER_TEMP/bazel https://github.com/bazelbuild/bazel/releases/download/$BV/bazel-$BV-darwin-x86_64
          chmod +x $RUNNER_TEMP/bazel
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          python3 -u build-system/Make/Make.py --bazel=$RUNNER_TEMP/bazel --overrideXcodeVersion --bazelUserRoot=$BAZEL_USER_ROOT --cacheDir=$BAZEL_CACHE_DIR build --configurationPath=build-system/ci-configuration.json --codesigningInformationPath=build-system/fake-codesigning --configuration=$BUILD_CONFIGURATION --buildNumber=$BUILD_NUMBER --disableExtensions --skipDsym --ciFast --continueOnError --outputBuildArtifactsPath=build/artifacts 2>&1 | tee release-build.log

      - name: Save Bazel cache
        if: ${{ !cancelled() && steps.bazel-cache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BAZEL_CACHE_DIR }}
            ${{ env.BAZEL_REPO_CACHE }}
          key: bazel-intel-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}

      - name: Collect IPA
        run: |
          set -euo pipefail
          SRC="$(find build/artifacts bazel-bin/Telegram bazel-out -name 'Telegram.ipa' -type f 2>/dev/null | head -1 || true)"
          [ -n "$SRC" ] || { echo "::error::no Telegram.ipa"; exit 1; }
          cp -f "$SRC" artifacts/KNOWETSKI-TG-sideload.ipa
          ls -lh artifacts

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: KNOWETSKI-TG-sideload
          path: artifacts/KNOWETSKI-TG-sideload.ipa
          retention-days: 14
